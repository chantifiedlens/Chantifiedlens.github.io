name: Build and deploy repository showcase

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Test category rules and API handling
        run: npm test
      - name: Restore last successful public snapshot
        uses: actions/cache/restore@v4
        with:
          path: data/repositories.json
          key: public-repos-v1-${{ hashFiles('config/site.mjs', 'lib/repositories.mjs') }}-${{ github.run_id }}
          restore-keys: |
            public-repos-v1-${{ hashFiles('config/site.mjs', 'lib/repositories.mjs') }}-
      - name: Configure Pages
        id: pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
      - name: Retrieve repositories and build static pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SITE_PATH_PREFIX: ${{ steps.pages.outputs.base_path && format('{0}/', steps.pages.outputs.base_path) || '/' }}
        run: npm run build
      - name: Verify generated pages and original images
        env:
          SITE_PATH_PREFIX: ${{ steps.pages.outputs.base_path && format('{0}/', steps.pages.outputs.base_path) || '/' }}
        run: node scripts/check-site.mjs
      - name: Save complete public snapshot
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: actions/cache/save@v4
        with:
          path: data/repositories.json
          key: public-repos-v1-${{ hashFiles('config/site.mjs', 'lib/repositories.mjs') }}-${{ github.run_id }}
      - name: Upload static Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4